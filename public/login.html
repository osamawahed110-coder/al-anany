<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول — العناني للتسويق العقاري</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <div class="login-bg">
    <div class="particles" id="particles"></div>
    <div class="login-container">
      <div class="login-card">
        <div class="logo-area">
          <div class="logo-icon">
            <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
              <polygon points="40,5 75,70 5,70" fill="none" stroke="#C9A84C" stroke-width="3"/>
              <polygon points="40,18 65,62 15,62" fill="#C9A84C" opacity="0.15"/>
              <text x="40" y="52" text-anchor="middle" fill="#C9A84C" font-size="20" font-family="Cairo" font-weight="900">ع</text>
            </svg>
          </div>
          <h1 class="logo-name">العناني</h1>
          <p class="logo-sub">للتسويق العقاري</p>
        </div>

        <div class="login-divider"></div>

        <h2 class="login-title">تسجيل الدخول</h2>
        <p class="login-desc">أدخل بياناتك للوصول إلى لوحة التحكم</p>

        <form id="loginForm" class="login-form">
          <div class="field-group">
            <label for="username">اسم المستخدم</label>
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" required autocomplete="username" />
            </div>
          </div>

          <div class="field-group">
            <label for="password">كلمة المرور</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password" />
              <button type="button" class="toggle-pass" id="togglePass">👁️</button>
            </div>
          </div>

          <div id="errorMsg" class="error-msg" style="display:none;"></div>

          <button type="submit" class="login-btn" id="loginBtn">
            <span class="btn-text">دخول إلى لوحة التحكم</span>
            <span class="btn-loader" style="display:none;">جارٍ التحقق...</span>
          </button>
        </form>

        <a href="/" class="back-link">← العودة إلى الموقع الرئيسي</a>
      </div>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
